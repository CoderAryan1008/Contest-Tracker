name: Sync contests

on:
  schedule:
    # GitHub's cron runs in UTC and can drift a few minutes under load —
    # fine for a "roughly every 30 min" refresh job.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  sync:
    runs-on: ubuntu-latest #Abb github humme ek virtual machine provide karega for running the job
    steps:
      - name: Ping sync-contests endpoint
        run: |
          curl -sf -X POST "${{ secrets.SYNC_URL }}/api/internal/sync-contests" \
            -H "x-sync-key: ${{ secrets.SYNC_SECRET }}"
